const c=document.querySelector('canvas'),g=c.getContext('2d'),S=document.querySelector('#score'),B=document.querySelector('#balls');let score=0,balls=3,active=false,ready=true,over=false;const ball={x:400,y:638,vx:0,vy:0,r:8};const keys={l:false,r:false};const bumpers=[{x:135,y:205,r:30,col:'#ff5ac8'},{x:278,y:205,r:30,col:'#40eaff'},{x:207,y:306,r:27,col:'#ffce58'}];const posts=[{x:83,y:527,r:12},{x:344,y:527,r:12},{x:168,y:563,r:9},{x:259,y:563,r:9}];let inLane=true, gateFlash=0;let last=performance.now();function reset(){score=0;balls=3;over=false;targetsHit=0;objects.forEach(o=>{if(o.type==='target')o.hits=0});newBall();}function newBall(){inLane=true;gateFlash=0;active=false;ready=true;ball.x=400;ball.y=638;ball.vx=0;ball.vy=0;update()}function update(){S.textContent='SCORE '+String(score).padStart(6,'0');B.textContent='BALLEN '+balls}function launch(){if(editor)return;if(over){reset();return}if(ready){ready=false;active=true;ball.vx=0;ball.vy=-19.5}}function line(x1,y1,x2,y2,col='#72dffa',w=5){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function collideCircle(o,restitution=1.07){let dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy)||1,min=ball.r+o.r;if(d<min){let nx=dx/d,ny=dy/d;ball.x=o.x+nx*min;ball.y=o.y+ny*min;let v=ball.vx*nx+ball.vy*ny;if(v<0){ball.vx-=(1+restitution)*v*nx;ball.vy-=(1+restitution)*v*ny}if(o.col){ball.vx+=nx*2.4;ball.vy+=ny*2.4;score+=100;update()}}}function segment(x1,y1,x2,y2,bounce=0.86){let dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((ball.x-x1)*dx+(ball.y-y1)*dy)/(dx*dx+dy*dy))),px=x1+t*dx,py=y1+t*dy,nx=ball.x-px,ny=ball.y-py,d=Math.hypot(nx,ny)||1;if(d<ball.r+3){nx/=d;ny/=d;ball.x=px+nx*(ball.r+3);ball.y=py+ny*(ball.r+3);let v=ball.vx*nx+ball.vy*ny;if(v<0){ball.vx-=(1+bounce)*v*nx;ball.vy-=(1+bounce)*v*ny}}}function flipper(o){
